version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm run project-setup
    build:
      commands:
        - hugo --gc --minify --baseURL https://gp-maroc.ma/
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
